<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .bar { fill: #161b22; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; }
      .text { font-family: "SF Mono", "Fira Code", Menlo, monospace; font-size: 13.5px; fill: #e6edf3; }
      .prompt { fill: #38bdf8; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .dim { fill: #7d8590; }
      .accent { fill: #58a6ff; }
      .green { fill: #3fb950; font-weight: 600; }
      .yellow { fill: #d29922; }
      .purple { fill: #bc8cff; }

      @keyframes fade1 { 0%, 5% { opacity: 0; } 10%, 100% { opacity: 1; } }
      @keyframes fade2 { 0%, 18% { opacity: 0; } 25%, 100% { opacity: 1; } }
      @keyframes fade3 { 0%, 35% { opacity: 0; } 42%, 100% { opacity: 1; } }
      @keyframes fade4 { 0%, 52% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes fade5 { 0%, 70% { opacity: 0; } 78%, 100% { opacity: 1; } }
      @keyframes fade6 { 0%, 85% { opacity: 0; } 92%, 100% { opacity: 1; } }

      .line1 { animation: fade1 12s infinite; }
      .line2 { animation: fade2 12s infinite; }
      .line3 { animation: fade3 12s infinite; }
      .line4 { animation: fade4 12s infinite; }
      .line5 { animation: fade5 12s infinite; }
      .line6 { animation: fade6 12s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="480" class="bg" />
  
  <!-- Header Bar -->
  <path d="M0 12C0 5.373 5.373 0 12 0h826c6.627 0 12 5.373 12 12v32H0V12z" class="bar" />
  <circle cx="24" cy="22" r="6" fill="#ff5f56" />
  <circle cx="44" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="22" r="6" fill="#27c93f" />
  <text x="425" y="27" text-anchor="middle" class="title">deep-dossier &mdash; bash &mdash; 85x24</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 75)" class="text">
    <!-- Command Line -->
    <text y="0">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">deep-dossier "Analyze battery degradation in commercial EVs (LFP vs NMC)"</tspan>
    </text>

    <!-- Line 1: Startup Banner -->
    <g class="line1" transform="translate(0, 36)">
      <text y="0" class="accent">⚡ Deep Dossier &bull; Autonomous Multi-Step Research Agent (1M+ Token Context)</text>
      <text y="24" class="dim">[*] Provider: GEMINI | Model: gemini-2.5-flash | Depth: 2 | Breadth: 4</text>
    </g>

    <!-- Line 2: Query Decomposition -->
    <g class="line2" transform="translate(0, 96)">
      <text y="0" class="yellow">[*] Phase 1: Generating research plan and query decomposition...</text>
      <text y="24" class="dim">  &bull; Formulated 3 search hypotheses: cycle life comparison, SEI layer growth, thermal stress</text>
    </g>

    <!-- Line 3: Parallel Crawling -->
    <g class="line3" transform="translate(0, 156)">
      <text y="0" class="accent">[*] Phase 2: Recursively crawling 14 primary sources in parallel (DuckDuckGo + Web)...</text>
      <text y="24" class="dim">  &bull; Fetched: Journal of Power Sources (PDF) [142k chars]</text>
      <text y="48" class="dim">  &bull; Fetched: SAE International Technical Papers [88k chars]</text>
    </g>

    <!-- Line 4: Fact Checking & Knowledge Gaps -->
    <g class="line4" transform="translate(0, 240)">
      <text y="0" class="purple">[*] Phase 3: Analyzing knowledge gaps &amp; cross-verifying numeric citations...</text>
      <text y="24" class="dim">  &bull; Resolved discrepancy in LFP calendar aging at 45&deg;C via secondary study</text>
    </g>

    <!-- Line 5: Synthesis -->
    <g class="line5" transform="translate(0, 300)">
      <text y="0" class="green">[*] Phase 4: Synthesizing executive dossier with interactive citations...</text>
      <text y="24" class="dim">  &bull; Ingested 184,320 characters of evidence across 14 documents</text>
    </g>

    <!-- Line 6: Output Ready -->
    <g class="line6" transform="translate(0, 360)">
      <text y="0" class="green">✨ Research Complete! Deliverables generated:</text>
      <text y="24" class="cmd">  &bull; Markdown Dossier: <tspan class="accent">./research_outputs/battery_degradation.md</tspan></text>
      <text y="48" class="cmd">  &bull; Apple HIG HTML:  <tspan class="accent">./research_outputs/battery_degradation.html</tspan></text>
    </g>
  </g>
</svg>
